<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBUST QC VISION - Stable Multi-Scale</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@600;700&display=swap');
        
        :root { 
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --success: #059669; 
            --danger: #dc2626; 
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 16px; 
            margin: 0; 
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 16px;
            color: #0369a1;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .panel-title { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-family: 'Oxanium', sans-serif; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .display-box { 
            border: 2px dashed #cbd5e1; 
            border-radius: 12px; 
            aspect-ratio: 4/3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            background-color: #f1f5f9;
        }
        
        .display-box img, .display-box video, .display-box canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            position: absolute;
        }
        
        .file-input-wrapper {
            margin-top: 8px;
            width: 100%;
            font-size: 0.85rem;
            color: var(--text);
            padding: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: #475569;
            box-shadow: 0 2px 4px rgba(71, 85, 105, 0.2);
        }
        .btn-secondary:hover { background: #334155; }
        .btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .status-bar {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .popup-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 350px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .popup-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: 'Oxanium', sans-serif;
        }
        .popup-message {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .popup-close-btn {
            background: #e2e8f0;
            color: var(--text);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .popup-close-btn:hover { background: #cbd5e1; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
    </style>
    
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>

    <h1>ROBUST QC VISION</h1>

    <div class="panel">
        <div class="panel-title">1. ภาพ Micro Detail ต้นฉบับ</div>
        <div class="display-box"><canvas id="refCanvas"></canvas></div>
        <input type="file" id="fileInputRef" class="file-input-wrapper" accept="image/*">
    </div>

    <div class="panel">
        <div class="panel-title">2. ภาพเปรียบเทียบ (กล้องมือถือ / ไฟล์ภาพ)</div>
        <div class="display-box">
            <video id="videoElement" autoplay playsinline muted style="display:none;"></video>
            <img id="targetImage" alt="Target File" style="display:none;">
            <canvas id="outputCanvas"></canvas>
        </div>
        
        <div class="controls-row">
            <button class="btn btn-secondary" id="btnToggleCam">เปิดกล้องมือถือ</button>
            <div id="cameraHint" style="font-size:.75rem;color:#64748b;line-height:1.45;margin-top:8px;text-align:center;">
                ระบบปรับสมดุลแสงและสเกลอัตโนมัติ (Stable Mode)
            </div>
        </div>
        
        <div style="margin-top: 12px;">
            <label class="panel-title" style="display:block; margin-bottom:4px;">เลือกไฟล์ภาพเปรียบเทียบจากเครื่อง:</label>
            <input type="file" id="fileInputTarget" class="file-input-wrapper" accept="image/*">
        </div>

        <div style="margin-top: 12px;">
            <button class="btn" id="btnScan">เริ่มสแกนตรวจสอบอัจฉริยะ</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">สถานะ: กำลังโหลด OpenCV Engine...</div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup-box" id="popupBox">
        <div class="popup-title" id="popupTitle">ผลการสแกน</div>
        <div class="popup-message" id="popupMessage"></div>
        <button class="popup-close-btn" onclick="closePopup()">ปิดหน้าต่าง</button>
    </div>

    <script>
        const refCanvas = document.getElementById('refCanvas');
        const videoElement = document.getElementById('videoElement');
        const targetImage = document.getElementById('targetImage');
        const outputCanvas = document.getElementById('outputCanvas');
        const btnScan = document.getElementById('btnScan');
        const btnToggleCam = document.getElementById('btnToggleCam');
        const statusBar = document.getElementById('statusBar');

        const popupOverlay = document.getElementById('popupOverlay');
        const popupBox = document.getElementById('popupBox');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');

        let isCvReady = false;
        let cameraStream = null;
        let isCameraActive = false;
        let activeSourceType = null;
        let templateMat = null;
        let templateDotCount = null;

        let checkInterval = setInterval(() => {
            if (typeof cv !== 'undefined' && typeof cv.Mat === 'function') {
                clearInterval(checkInterval);
                isCvReady = true;
                statusBar.innerText = "สถานะ: พร้อมใช้งาน (Stable Multi-Scale Mode)";
            }
        }, 300);

        document.getElementById('fileInputRef').onchange = (e) => { 
            if(e.target.files[0]) {
                if (!isCvReady) {
                    alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่แล้วลองใหม่อีกครั้ง");
                    return;
                }
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = function() {
                        try {
                            if (templateMat) { templateMat.delete(); templateMat = null; }
                            let canvas = document.createElement('canvas');
                            canvas.width = img.naturalWidth;
                            canvas.height = img.naturalHeight;
                            let ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            
                            templateMat = cv.imread(canvas);
                            if (templateMat.empty()) throw new Error("ไม่สามารถสร้าง Matrix ได้");
                            
                            cv.imshow('refCanvas', templateMat);
                            statusBar.innerText = "สถานะ: โหลดภาพต้นฉบับสำเร็จ พร้อมสแกน";
                        } catch (err) {
                            console.error("REF IMAGE ERROR:", err, err && err.stack);
                            alert("ไม่สามารถประมวลผลภาพต้นฉบับได้: " + err.message);
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('fileInputTarget').onchange = (e) => {
            if (e.target.files[0]) {
                if (isCameraActive) { stopCamera(); }
                targetImage.src = URL.createObjectURL(e.target.files[0]);
                targetImage.onload = () => {
                    activeSourceType = 'file';
                    let canvasCtx = outputCanvas.getContext('2d');
                    outputCanvas.width = targetImage.naturalWidth;
                    outputCanvas.height = targetImage.naturalHeight;
                    canvasCtx.drawImage(targetImage, 0, 0);
                    outputCanvas.style.display = 'block';
                    targetImage.style.display = 'none';
                    videoElement.style.display = 'none';
                };
            }
        };

        function stopCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); }
            videoElement.srcObject = null;
            isCameraActive = false;
            btnToggleCam.innerText = "เปิดกล้องมือถือ";
            btnToggleCam.style.background = "#475569";
        }

        btnToggleCam.onclick = async () => {
            if (!isCameraActive) {
                try {
                    document.getElementById('fileInputTarget').value = "";
                    const constraints = {
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280, min: 640 },
                            height: { ideal: 720, min: 480 },
                            frameRate: { ideal: 30, min: 15 }
                        }
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();
                    videoElement.style.display = 'block';
                    targetImage.style.display = 'none';
                    outputCanvas.style.display = 'none';
                    
                    isCameraActive = true;
                    activeSourceType = 'camera';
                    btnToggleCam.innerText = "ปิดกล้อง Live";
                    btnToggleCam.style.background = "var(--danger)";
                } catch (err) {
                    alert("ไม่สามารถเปิดกล้องได้: " + err.message);
                }
            } else {
                stopCamera();
                activeSourceType = null;
            }
        };

        function closePopup() {
            popupOverlay.style.display = 'none';
            popupBox.style.display = 'none';
        }


        // ============================================================
        // MICRO DOT COUNTING
        // เกณฑ์ใหม่: PASS เมื่อจำนวนจุด Micro ของภาพต้นฉบับ
        // และภาพตรวจสอบ "เท่ากันเท่านั้น"
        // ============================================================
        function countMicroDots(inputMat) {
            let gray = null, blur = null, binary = null, kernel = null, opened = null;
            let contours = null, hierarchy = null;

            try {
                gray = new cv.Mat();

                if (inputMat.channels() === 4) {
                    cv.cvtColor(inputMat, gray, cv.COLOR_RGBA2GRAY);
                } else if (inputMat.channels() === 3) {
                    cv.cvtColor(inputMat, gray, cv.COLOR_RGB2GRAY);
                } else {
                    inputMat.copyTo(gray);
                }

                // ลด noise เล็กน้อยก่อนแยกจุด
                blur = new cv.Mat();
                cv.GaussianBlur(gray, blur, new cv.Size(3, 3), 0);

                // OTSU แยกจุดที่สว่างออกจากพื้นหลัง
                binary = new cv.Mat();
                cv.threshold(
                    blur,
                    binary,
                    0,
                    255,
                    cv.THRESH_BINARY + cv.THRESH_OTSU
                );

                // กำจัด noise จุดเล็ก ๆ และเชื่อมส่วนของจุดที่แตก
                kernel = cv.getStructuringElement(
                    cv.MORPH_ELLIPSE,
                    new cv.Size(3, 3)
                );
                opened = new cv.Mat();
                cv.morphologyEx(binary, opened, cv.MORPH_OPEN, kernel);

                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
                cv.findContours(
                    opened,
                    contours,
                    hierarchy,
                    cv.RETR_EXTERNAL,
                    cv.CHAIN_APPROX_SIMPLE
                );

                /*
                 * ใช้พื้นที่ของจุดแบบสัมพันธ์กับขนาดภาพ
                 * เพื่อให้การนับยังทำงานได้เมื่อภาพถูก scale
                 */
                const imageArea = inputMat.cols * inputMat.rows;
                const minArea = Math.max(2, imageArea * 0.000002);
                const maxArea = Math.max(20, imageArea * 0.01);

                let count = 0;
                let validDots = [];

                for (let i = 0; i < contours.size(); i++) {
                    const contour = contours.get(i);
                    const area = cv.contourArea(contour);

                    if (area >= minArea && area <= maxArea) {
                        const rect = cv.boundingRect(contour);
                        const w = rect.width;
                        const h = rect.height;

                        // Micro Dot ควรมีลักษณะใกล้เคียงจุด ไม่ใช่เส้นยาว
                        const aspect = Math.max(w, h) / Math.max(1, Math.min(w, h));

                        if (aspect <= 3.0) {
                            count++;
                            validDots.push({
                                x: rect.x,
                                y: rect.y,
                                w: rect.width,
                                h: rect.height
                            });
                        }
                    }

                    contour.delete();
                }

                return {
                    count: count,
                    dots: validDots
                };

            } finally {
                if (gray) gray.delete();
                if (blur) blur.delete();
                if (binary) binary.delete();
                if (kernel) kernel.delete();
                if (opened) opened.delete();
                if (contours) contours.delete();
                if (hierarchy) hierarchy.delete();
            }
        }

        // ============================================================
        // MICRO DOT COUNTING (แบบตรวจจับด้วยสี)
        // ใช้สำหรับจุด Micro ที่ถูกออกแบบให้ "แนบเนียน" กลืนกับพื้นหลัง
        // จนตาเปล่าแยกยาก แต่มี Hue เฉพาะตัวที่ไม่เกิดขึ้นเองตามธรรมชาติ
        // ของลวดลาย จึงกรองด้วย HSV แทนความสว่าง (threshold ขาวดำ)
        //
        // *** ปรับค่า DOT_HUE_RANGE ตรงนี้ให้ตรงกับสีจุดจริงที่ใช้พิมพ์ ***
        // วิธีหาค่า: เปิดภาพต้นฉบับด้วยโปรแกรมแต่งภาพ, สุ่มสีที่จุด,
        // แปลงเป็น HSV (สเกล OpenCV: H 0-179, S 0-255, V 0-255)
        // แล้วตั้งช่วงกว้างพอให้ครอบคลุมสีที่อาจแปรผันจากแสง/กล้องมือถือ
        // ============================================================
        const DOT_HUE_RANGE = {
            lo: [116, 100, 40],   // [H, S, V] ขั้นต่ำ
            hi: [132, 170, 85]    // [H, S, V] สูงสุด
        };

        function countMicroDotsColor(inputMat) {
            let rgb = null, hsv = null, mask = null, kernel = null, opened = null;
            let contours = null, hierarchy = null;

            try {
                rgb = new cv.Mat();
                if (inputMat.channels() === 4) {
                    cv.cvtColor(inputMat, rgb, cv.COLOR_RGBA2RGB);
                } else if (inputMat.channels() === 3) {
                    inputMat.copyTo(rgb);
                } else {
                    // ภาพขาวดำล้วน ไม่มีข้อมูลสีให้ตรวจจับ
                    return { count: 0, dots: [] };
                }

                hsv = new cv.Mat();
                cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);

                mask = new cv.Mat();
                let low = new cv.Mat(
                    hsv.rows, hsv.cols, hsv.type(),
                    new cv.Scalar(DOT_HUE_RANGE.lo[0], DOT_HUE_RANGE.lo[1], DOT_HUE_RANGE.lo[2], 0)
                );
                let high = new cv.Mat(
                    hsv.rows, hsv.cols, hsv.type(),
                    new cv.Scalar(DOT_HUE_RANGE.hi[0], DOT_HUE_RANGE.hi[1], DOT_HUE_RANGE.hi[2], 255)
                );
                cv.inRange(hsv, low, high, mask);
                low.delete();
                high.delete();

                kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
                opened = new cv.Mat();
                cv.morphologyEx(mask, opened, cv.MORPH_OPEN, kernel);

                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
                cv.findContours(
                    opened,
                    contours,
                    hierarchy,
                    cv.RETR_EXTERNAL,
                    cv.CHAIN_APPROX_SIMPLE
                );

                const imageArea = inputMat.cols * inputMat.rows;
                const minArea = Math.max(4, imageArea * 0.000002);
                const maxArea = Math.max(20, imageArea * 0.005);

                let count = 0;
                let validDots = [];

                for (let i = 0; i < contours.size(); i++) {
                    const contour = contours.get(i);
                    const area = cv.contourArea(contour);

                    if (area >= minArea && area <= maxArea) {
                        const rect = cv.boundingRect(contour);
                        count++;
                        validDots.push({
                            x: rect.x,
                            y: rect.y,
                            w: rect.width,
                            h: rect.height
                        });
                    }
                    contour.delete();
                }

                return { count: count, dots: validDots };

            } finally {
                if (rgb) rgb.delete();
                if (hsv) hsv.delete();
                if (mask) mask.delete();
                if (kernel) kernel.delete();
                if (opened) opened.delete();
                if (contours) contours.delete();
                if (hierarchy) hierarchy.delete();
            }
        }

        function drawDotMarkers(displayMat, dots, offsetX = 0, offsetY = 0, scaleX = 1, scaleY = 1) {
            drawDotMarkersColored(displayMat, dots, offsetX, offsetY, scaleX, scaleY, new cv.Scalar(0, 255, 0, 255));
        }

        function drawDotMarkersColored(displayMat, dots, offsetX = 0, offsetY = 0, scaleX = 1, scaleY = 1, color = new cv.Scalar(0, 255, 0, 255)) {
            for (const dot of dots) {
                const x = Math.round(offsetX + dot.x * scaleX);
                const y = Math.round(offsetY + dot.y * scaleY);
                const w = Math.max(4, Math.round(dot.w * scaleX));
                const h = Math.max(4, Math.round(dot.h * scaleY));

                cv.rectangle(
                    displayMat,
                    new cv.Point(x, y),
                    new cv.Point(x + w, y + h),
                    color,
                    2
                );
            }
        }

        btnScan.onclick = async () => {
            if (!isCvReady) { alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่"); return; }
            if (!templateMat || templateMat.empty()) { alert("กรุณาเลือกภาพ Micro Detail ต้นฉบับก่อนทำการสแกน"); return; }
            if (!activeSourceType) { alert("กรุณาเปิดกล้องหรือเลือกไฟล์ภาพเปรียบเทียบก่อนทำการสแกน"); return; }

            if (isCameraActive) {
                await new Promise(resolve => setTimeout(resolve, 350));
                if (!videoElement.videoWidth || !videoElement.videoHeight) {
                    alert("กล้องยังไม่พร้อม กรุณาลองใหม่อีกครั้ง");
                    return;
                }
            }

            let originalText = btnScan.innerText;
            btnScan.innerText = "กำลังประมวลผลและสแกน...";
            btnScan.disabled = true;

            setTimeout(() => {
                let targetMat = null, grayTarget = null, grayTempl = null, displayMat = null;
                let eqTarget = null, eqTempl = null;
                try {
                    let sourceElem = isCameraActive ? videoElement : outputCanvas;
                    let canvas = document.createElement('canvas');
                    canvas.width = sourceElem.naturalWidth || sourceElem.videoWidth || sourceElem.width;
                    canvas.height = sourceElem.naturalHeight || sourceElem.videoHeight || sourceElem.height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(sourceElem, 0, 0);
                    
                    targetMat = cv.imread(canvas);
                    if (targetMat.empty()) throw new Error("ไม่สามารถอ่านภาพเปรียบเทียบได้");

                    grayTarget = new cv.Mat();
                    grayTempl = new cv.Mat();
                    
                    if (targetMat.channels() === 4) cv.cvtColor(targetMat, grayTarget, cv.COLOR_RGBA2GRAY);
                    else cv.cvtColor(targetMat, grayTarget, cv.COLOR_RGB2GRAY);
                    
                    if (templateMat.channels() === 4) cv.cvtColor(templateMat, grayTempl, cv.COLOR_RGBA2GRAY);
                    else cv.cvtColor(templateMat, grayTempl, cv.COLOR_RGB2GRAY);

                    // ใช้ EqualizeHist เพื่อปรับสมดุลแสงสว่างให้ทั่วภาพโดยเสถียร รองรับมาตรฐานทุกเบราว์เซอร์
                    eqTarget = new cv.Mat();
                    eqTempl = new cv.Mat();
                    cv.equalizeHist(grayTarget, eqTarget);
                    cv.equalizeHist(grayTempl, eqTempl);

                    // ------------------------------------------------------------
                    // ใช้ Template Matching "เฉพาะเพื่อหาตำแหน่ง Micro Detail"
                    // ไม่ใช้ Match Score เป็นเกณฑ์ PASS อีกต่อไป
                    // ------------------------------------------------------------
                    let bestScore = -1;
                    let bestLoc = null;
                    let bestScale = 1.0;
                    let bestW = 0, bestH = 0;

                    let scales = [0.5, 0.7, 0.9, 1.0, 1.1, 1.3, 1.5];

                    for (let scale of scales) {
                        let resizedTempl = new cv.Mat();
                        let dsize = new cv.Size(
                            Math.round(eqTempl.cols * scale),
                            Math.round(eqTempl.rows * scale)
                        );

                        if (
                            dsize.width <= 0 ||
                            dsize.height <= 0 ||
                            dsize.width > eqTarget.cols ||
                            dsize.height > eqTarget.rows
                        ) {
                            resizedTempl.delete();
                            continue;
                        }

                        cv.resize(eqTempl, resizedTempl, dsize, 0, 0, cv.INTER_AREA);

                        let res = new cv.Mat();
                        cv.matchTemplate(
                            eqTarget,
                            resizedTempl,
                            res,
                            cv.TM_CCOEFF_NORMED
                        );

                        let minMax = cv.minMaxLoc(res);

                        if (minMax.maxVal > bestScore) {
                            bestScore = minMax.maxVal;
                            bestLoc = minMax.maxLoc;
                            bestScale = scale;
                            bestW = resizedTempl.cols;
                            bestH = resizedTempl.rows;
                        }

                        resizedTempl.delete();
                        res.delete();
                    }

                    if (!bestLoc) {
                        throw new Error("ไม่สามารถหาตำแหน่ง Micro Detail ในภาพตรวจสอบได้");
                    }

                    // ป้องกัน ROI เกินขอบเขตภาพ (สาเหตุที่พบบ่อยของ error ตอนสร้าง cv.Rect/cv.Mat ROI)
                    if (
                        bestW <= 0 || bestH <= 0 ||
                        bestLoc.x < 0 || bestLoc.y < 0 ||
                        bestLoc.x + bestW > eqTarget.cols ||
                        bestLoc.y + bestH > eqTarget.rows
                    ) {
                        throw new Error(
                            "ตำแหน่ง Micro Detail ที่พบไม่อยู่ในขอบเขตภาพ (ROI out of bounds) " +
                            `[x:${bestLoc.x}, y:${bestLoc.y}, w:${bestW}, h:${bestH}, ` +
                            `target:${eqTarget.cols}x${eqTarget.rows}]`
                        );
                    }

                    // ------------------------------------------------------------
                    // สร้างภาพ ROI ที่ Template Matching พบ (พิกัดตำแหน่งเท่านั้น)
                    // ตัดจาก "ภาพสีจริง" (targetMat) ไม่ใช่ภาพขาวดำ eqTarget
                    // เพราะการนับ Micro Dot แบบใหม่ใช้สีในการตรวจจับ
                    //
                    // หมายเหตุ: ใช้ .roi(rect) แทน new cv.Mat(mat, rect)
                    // เพราะ OpenCV.js บางบิลด์มีบั๊ก embind กับ constructor รูปแบบหลัง
                    // ทำให้เกิด "TypeError: Missing field"
                    // ------------------------------------------------------------
                    let targetROIColor = targetMat.roi(
                        new cv.Rect(
                            bestLoc.x,
                            bestLoc.y,
                            bestW,
                            bestH
                        )
                    );

                    let targetROIColorOriginalScale = new cv.Mat();
                    cv.resize(
                        targetROIColor,
                        targetROIColorOriginalScale,
                        new cv.Size(eqTempl.cols, eqTempl.rows),
                        0,
                        0,
                        cv.INTER_AREA
                    );

                    // นับจำนวน Micro Dot จากภาพต้นฉบับและภาพตรวจสอบ
                    // ใช้การตรวจจับด้วย "สี" (HSV) แทนความสว่าง เพื่อจับจุดแนบเนียน
                    // ที่ผสมกลืนกับพื้นหลังจนตาเปล่าแยกไม่ออก
                    const refDotResult = countMicroDotsColor(templateMat);
                    const targetDotResult = countMicroDotsColor(targetROIColorOriginalScale);

                    const referenceDotCount = refDotResult.count;
                    const targetDotCount = targetDotResult.count;

                    // ============================================================
                    // สำคัญ: PASS ได้เมื่อจำนวนจุด "เท่ากันเท่านั้น"
                    // มากกว่า หรือ น้อยกว่า = FAIL
                    // ไม่ใช้ Match Score เป็นเกณฑ์ PASS
                    // ============================================================
                    const isPass = referenceDotCount === targetDotCount;

                    // เตรียมภาพแสดงผล
                    displayMat = new cv.Mat();
                    if (targetMat.channels() === 4) {
                        targetMat.copyTo(displayMat);
                    } else {
                        cv.cvtColor(
                            targetMat,
                            displayMat,
                            cv.COLOR_RGB2RGBA
                        );
                    }

                    // วาดกรอบบริเวณ Micro Detail ที่ตรวจพบ
                    let p1 = new cv.Point(bestLoc.x, bestLoc.y);
                    let p2 = new cv.Point(
                        bestLoc.x + bestW,
                        bestLoc.y + bestH
                    );

                    cv.rectangle(
                        displayMat,
                        p1,
                        p2,
                        isPass
                            ? new cv.Scalar(0, 255, 0, 255)
                            : new cv.Scalar(0, 0, 255, 255),
                        4
                    );

                    // ------------------------------------------------------------
                    // วาดจุดแดงกำกับตำแหน่ง Micro Dot แต่ละจุดที่ตรวจพบจริง
                    // (ก่อนหน้านี้มีฟังก์ชัน drawDotMarkers แต่ไม่เคยถูกเรียกใช้
                    //  ทำให้มองไม่เห็นว่าโค้ดตรวจจับจุดไหนบ้าง)
                    // ------------------------------------------------------------
                    // จุดบนภาพเปรียบเทียบ: map พิกัดจาก targetROIOriginalScale
                    // (ขนาดเท่า eqTempl) กลับไปยังตำแหน่งจริงบน displayMat
                    const mapScaleX = bestW / eqTempl.cols;
                    const mapScaleY = bestH / eqTempl.rows;
                    drawDotMarkersColored(
                        displayMat,
                        targetDotResult.dots,
                        bestLoc.x,
                        bestLoc.y,
                        mapScaleX,
                        mapScaleY,
                        new cv.Scalar(255, 0, 0, 255) // สีแดง
                    );

                    // จุดบนภาพต้นฉบับ: วาดทับลงบน refCanvas ด้วย เพื่อเทียบกับจุดแดง
                    // ที่ผู้ใช้ฝังไว้ในภาพต้นฉบับเอง
                    let refDisplayMat = new cv.Mat();
                    if (templateMat.channels() === 4) {
                        templateMat.copyTo(refDisplayMat);
                    } else {
                        cv.cvtColor(templateMat, refDisplayMat, cv.COLOR_RGB2RGBA);
                    }
                    drawDotMarkersColored(
                        refDisplayMat,
                        refDotResult.dots,
                        0, 0, 1, 1,
                        new cv.Scalar(255, 0, 0, 255) // สีแดง
                    );
                    cv.imshow('refCanvas', refDisplayMat);
                    refDisplayMat.delete();

                    const resultText = isPass
                        ? `DOTS MATCH: ${targetDotCount}`
                        : `DOTS DIFFER: ${targetDotCount} / ${referenceDotCount}`;

                    cv.putText(
                        displayMat,
                        resultText,
                        new cv.Point(
                            bestLoc.x,
                            Math.max(30, bestLoc.y - 10)
                        ),
                        cv.FONT_HERSHEY_SIMPLEX,
                        0.75,
                        isPass
                            ? new cv.Scalar(0, 255, 0, 255)
                            : new cv.Scalar(0, 0, 255, 255),
                        2
                    );

                    // แสดงจำนวนจุดที่ตรวจพบใน Console สำหรับ Debug
                    console.log(
                        "Micro Dot Count:",
                        {
                            reference: referenceDotCount,
                            target: targetDotCount,
                            difference: targetDotCount - referenceDotCount,
                            pass: isPass
                        }
                    );

                    cv.imshow('outputCanvas', displayMat);

                    popupTitle.innerHTML = isPass
                        ? `<span class="text-success">✅ PASS // จำนวน Micro เท่ากัน</span>`
                        : `<span class="text-danger">❌ FAIL // จำนวน Micro ไม่เท่ากัน</span>`;

                    popupMessage.innerHTML = `
                        จำนวน Micro ต้นฉบับ:
                        <span style="font-size:1.25em;font-weight:bold;color:#1e293b;">
                            ${referenceDotCount}
                        </span> จุด<br><br>

                        จำนวน Micro ภาพตรวจสอบ:
                        <span style="font-size:1.25em;font-weight:bold;color:#1e293b;">
                            ${targetDotCount}
                        </span> จุด<br><br>

                        ส่วนต่าง:
                        <span style="font-size:1.15em;font-weight:bold;color:${isPass ? '#059669' : '#dc2626'};">
                            ${Math.abs(targetDotCount - referenceDotCount)}
                        </span> จุด<br><br>

                        <b>เกณฑ์ PASS: จำนวน Micro ต้องเท่ากัน 100%</b><br>
                        มากกว่าหรือน้อยกว่า = FAIL
                    `;

                    if (isCameraActive) {
                        videoElement.style.display = 'none';
                    }

                    outputCanvas.style.display = 'block';
                    popupOverlay.style.display = 'block';
                    popupBox.style.display = 'block';

                    targetROIColor.delete();
                    targetROIColorOriginalScale.delete();

                } catch(err) {
                    console.error("SCAN ERROR:", err);
                    console.error("Stack:", err && err.stack);
                    alert(
                        "เกิดข้อผิดพลาดในการตรวจสอบ: " + (err && err.message ? err.message : String(err)) +
                        "\n\n(เปิด Console ในเบราว์เซอร์ กด F12 เพื่อดูรายละเอียดเพิ่มเติม)"
                    );
                } finally {
                    if (targetMat) targetMat.delete();
                    if (grayTarget) grayTarget.delete();
                    if (grayTempl) grayTempl.delete();
                    if (eqTarget) eqTarget.delete();
                    if (eqTempl) eqTempl.delete();
                    if (displayMat) displayMat.delete();
                }

                btnScan.innerText = originalText; 
                btnScan.disabled = false;
            }, 100);
        };
    </script>
</body>
</html>
