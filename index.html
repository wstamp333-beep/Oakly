<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATTERN_SCAN QC VISION - Subtle Dark-Red Micro Detail</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@600;700&display=swap');
        
        :root { 
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --success: #059669; 
            --danger: #dc2626; 
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 16px; 
            margin: 0; 
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 16px;
            color: #0369a1;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .panel-title { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-family: 'Oxanium', sans-serif; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .display-box { 
            border: 2px dashed #cbd5e1; 
            border-radius: 12px; 
            aspect-ratio: 4/3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            background-color: #f1f5f9;
        }
        
        .display-box img, .display-box video, .display-box canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            position: absolute;
        }
        
        .file-input-wrapper {
            margin-top: 8px;
            width: 100%;
            font-size: 0.85rem;
            color: var(--text);
            padding: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #475569;
            box-shadow: 0 2px 4px rgba(71, 85, 105, 0.2);
        }
        
        .btn-secondary:hover {
            background: #334155;
        }

        .btn:disabled { 
            background: #cbd5e1; 
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .status-bar {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* Popup Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .popup-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 350px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .popup-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: 'Oxanium', sans-serif;
        }
        .popup-message {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .popup-close-btn {
            background: #e2e8f0;
            color: var(--text);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .popup-close-btn:hover {
            background: #cbd5e1;
        }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
    </style>
    
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>

    <h1>SECURITY SCAN</h1>

    <div class="panel">
        <div class="panel-title">ภาพสัญลักษณ์ต้นฉบับ — ใช้ภาพความละเอียดสูง</div>
        <div class="display-box"><canvas id="refCanvas"></canvas></div>
        <input type="file" id="fileInputRef" class="file-input-wrapper" accept="image/*">
    </div>

    <div class="panel">
        <div class="panel-title">ภาพเปรียบเทียบ — ตรวจ Micro Detail สีแดงเข้ม</div>
        <div class="display-box">
            <video id="videoElement" autoplay playsinline muted style="display:none;"></video>
            <img id="targetImage" alt="Target File" style="display:none;">
            <canvas id="outputCanvas"></canvas>
        </div>
        
        <div class="controls-row">
            <button class="btn btn-secondary" id="btnToggleCam">เปิดกล้อง</button>
        </div>
        
        <div style="margin-top: 12px;">
            <label class="panel-title" style="display:block; margin-bottom:4px;">เลือกไฟล์ภาพจากเครื่อง:</label>
            <input type="file" id="fileInputTarget" class="file-input-wrapper" accept="image/*">
        </div>

        <div style="margin-top: 12px;">
            <button class="btn" id="btnScan">เริ่มสแกน</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">สถานะ: กำลังโหลด OpenCV Engine...</div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup-box" id="popupBox">
        <div class="popup-title" id="popupTitle">ผลการสแกน</div>
        <div class="popup-message" id="popupMessage"></div>
        <button class="popup-close-btn" onclick="closePopup()">ปิดหน้าต่าง</button>
    </div>

    <script>
        const refCanvas = document.getElementById('refCanvas');
        const videoElement = document.getElementById('videoElement');
        const targetImage = document.getElementById('targetImage');
        const outputCanvas = document.getElementById('outputCanvas');
        const btnScan = document.getElementById('btnScan');
        const btnToggleCam = document.getElementById('btnToggleCam');
        const statusBar = document.getElementById('statusBar');

        const popupOverlay = document.getElementById('popupOverlay');
        const popupBox = document.getElementById('popupBox');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');

        let isCvReady = false;
        let cameraStream = null;
        let isCameraActive = false;
        let activeSourceType = null;
        let templateMat = null;

        let checkInterval = setInterval(() => {
            if (typeof cv !== 'undefined' && typeof cv.Mat === 'function') {
                clearInterval(checkInterval);
                isCvReady = true;
                statusBar.innerText = "สถานะ: พร้อมใช้งาน (ตรวจเฉพาะ Micro Detail สีแดงเข้ม)";
            }
        }, 300);

        document.getElementById('fileInputRef').onchange = (e) => { 
            if(e.target.files[0]) {
                if (!isCvReady) {
                    alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่แล้วเลือกไฟล์ใหม่อีกครั้ง");
                    return;
                }
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() {
                        if (templateMat) templateMat.delete();
                        templateMat = matFromElement(img, 4000);
                        cv.imshow('refCanvas', templateMat);
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        document.getElementById('fileInputTarget').onchange = (e) => {
            if (e.target.files[0]) {
                if (isCameraActive) { stopCamera(); }
                
                targetImage.src = URL.createObjectURL(e.target.files[0]);
                targetImage.onload = () => {
                    activeSourceType = 'file';
                    let canvasCtx = outputCanvas.getContext('2d');
                    outputCanvas.width = targetImage.naturalWidth;
                    outputCanvas.height = targetImage.naturalHeight;
                    canvasCtx.drawImage(targetImage, 0, 0);
                    outputCanvas.style.display = 'block';
                    targetImage.style.display = 'none';
                    videoElement.style.display = 'none';
                };
            }
        };

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            videoElement.srcObject = null;
            isCameraActive = false;
            btnToggleCam.innerText = "เปิดกล้อง";
            btnToggleCam.style.background = "#475569";
        }

        btnToggleCam.onclick = async () => {
            if (!isCameraActive) {
                try {
                    document.getElementById('fileInputTarget').value = "";
                    const constraints = {
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1920, min: 1280 },
                            height: { ideal: 1080, min: 720 },
                            frameRate: { ideal: 30, min: 15 }
                        }
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = cameraStream;
                    const track = cameraStream.getVideoTracks()[0];
                    if (track && track.applyConstraints) {
                        try {
                            const caps = track.getCapabilities ? track.getCapabilities() : {};
                            const advanced = {};
                            if (caps.focusMode && caps.focusMode.includes("continuous")) advanced.focusMode = "continuous";
                            if (caps.exposureMode && caps.exposureMode.includes("continuous")) advanced.exposureMode = "continuous";
                            if (Object.keys(advanced).length) await track.applyConstraints({ advanced: [advanced] });
                        } catch (e) { console.warn("Camera optimization:", e); }
                    }
                    await videoElement.play();
                    videoElement.style.display = 'block';
                    targetImage.style.display = 'none';
                    outputCanvas.style.display = 'none';
                    
                    isCameraActive = true;
                    activeSourceType = 'camera';
                    btnToggleCam.innerText = "ปิดกล้อง Live";
                    btnToggleCam.style.background = "var(--danger)";
                } catch (err) {
                    alert("ไม่สามารถเปิดกล้องได้: " + err.message);
                }
            } else {
                stopCamera();
                activeSourceType = null;
            }
        };

        function matFromElement(element, maxDim = 4000) {
            let canvas = document.createElement('canvas');
            let w = element.naturalWidth || element.videoWidth || element.width;
            let h = element.naturalHeight || element.videoHeight || element.height;

            if (w > maxDim || h > maxDim) {
                if (w > h) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                } else {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                }
            }
            canvas.width = w;
            canvas.height = h;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(element, 0, 0, w, h);
            return cv.imread(canvas);
        }

        function closePopup() {
            popupOverlay.style.display = 'none';
            popupBox.style.display = 'none';
        }

        function matToGray(src, dst) {
            if (src.channels() === 4) cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
            else if (src.channels() === 3) cv.cvtColor(src, dst, cv.COLOR_RGB2GRAY);
            else src.copyTo(dst);
        }

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/*
 * MICRO DETAIL TEST PROFILE
 * Reference artwork: near-black #111111
 * Suggested hidden-dot colors: #32171A to #3A181B
 * Dot size: 1–2 source pixels
 * Detector intentionally accepts dark, low-saturation red.
 *
 * If dots are still too visible:
 *   - move the artwork color closer to #111111, e.g. #2A1518
 *
 * If detection becomes too weak:
 *   - raise redLead sensitivity by reducing 9/6 slightly
 *   - or use a slightly lighter dot such as #3A181B
 */

        // Micro Detail = SUBTLE DARK-RED DOTS ONLY.
        // This version deliberately does NOT use OpenCV contour/connected-component
        // APIs for red-dot extraction because some OpenCV.js builds throw
        // "Cannot convert undefined to int" with those APIs.
        // The red-dot detection below is pure JavaScript pixel processing.
        function isRedPixel(r, g, b) {
            // Camera-tolerant dark-red detection: use chroma separation,
            // not only fixed RGB thresholds, because phones alter exposure,
            // white balance, gamma and compression.
            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);
            const redExcess = r - ((g + b) * 0.5);
            const redGap = r - Math.max(g, b);
            if (maxC < 22 || maxC > 180) return false;
            return redExcess >= 7 &&
                   redGap >= 5 &&
                   r > g * 1.12 &&
                   r > b * 1.08 &&
                   (maxC - minC) >= 7;
        }

        function getRedEvidenceInBox(image, cx, cy, radiusX, radiusY) {
            const {width, height, data} = image;
            const x0 = Math.max(0, Math.floor(cx - radiusX));
            const x1 = Math.min(width - 1, Math.ceil(cx + radiusX));
            const y0 = Math.max(0, Math.floor(cy - radiusY));
            const y1 = Math.min(height - 1, Math.ceil(cy + radiusY));
            let strong = 0, score = 0, maxRedExcess = 0;
            for (let y=y0; y<=y1; y++) {
                let p=y*width+x0;
                for (let x=x0; x<=x1; x++,p++) {
                    const i=p*4, r=data[i], g=data[i+1], bb=data[i+2];
                    const redExcess=r-((g+bb)*0.5);
                    const redGap=r-Math.max(g,bb);
                    maxRedExcess=Math.max(maxRedExcess,redExcess);
                    if (isRedPixel(r,g,bb)) {
                        strong++;
                        score += Math.min(30,redExcess);
                    } else if (redExcess>=4 && redGap>=2) {
                        score += Math.min(10,redExcess*0.75);
                    }
                }
            }
            return {strong,score,maxRedExcess};
        }
        function getRedComponentsFromCanvasSource(mat, minArea = 1) {
            // Convert Mat to a canvas so we can inspect RGBA pixels directly.
            const canvas = document.createElement('canvas');
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            cv.imshow(canvas, mat);
            const ctx = canvas.getContext('2d', {willReadFrequently:true});
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const w = canvas.width, h = canvas.height;

            // 1 byte/pixel mask. 1 = red candidate, 0 = not red.
            const mask = new Uint8Array(w * h);
            for (let y = 0, p = 0; y < h; y++) {
                for (let x = 0; x < w; x++, p++) {
                    const i = p * 4;
                    if (isRedPixel(data[i], data[i+1], data[i+2])) mask[p] = 1;
                }
            }

            const components = [];
            const stack = [];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const seed = y * w + x;
                    if (mask[seed] !== 1) continue;
                    mask[seed] = 0;
                    stack.length = 0;
                    stack.push(seed);

                    let area = 0, minX = x, maxX = x, minY = y, maxY = y;
                    let sumX = 0, sumY = 0;

                    while (stack.length) {
                        const idx = stack.pop();
                        const cy = Math.floor(idx / w);
                        const cx = idx - cy * w;
                        area++;
                        sumX += cx; sumY += cy;
                        if (cx < minX) minX = cx;
                        if (cx > maxX) maxX = cx;
                        if (cy < minY) minY = cy;
                        if (cy > maxY) maxY = cy;

                        // 8-connected red pixels.
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                const nx = cx + dx, ny = cy + dy;
                                if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                                const ni = ny * w + nx;
                                if (mask[ni] === 1) {
                                    mask[ni] = 0;
                                    stack.push(ni);
                                }
                            }
                        }
                    }

                    if (area >= minArea) {
                        components.push({
                            x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1,
                            area,
                            cx:sumX/area, cy:sumY/area
                        });
                    }
                }
            }
            return components;
        }

        function makeRGBAData(mat) {
            const canvas = document.createElement('canvas');
            canvas.width = mat.cols;
            canvas.height = mat.rows;
            cv.imshow(canvas, mat);
            const ctx = canvas.getContext('2d', {willReadFrequently:true});
            return { width: canvas.width, height: canvas.height, data: ctx.getImageData(0,0,canvas.width,canvas.height).data };
        }

        function getRedPixelCountInBox(image, cx, cy, radiusX, radiusY) {
            return getRedEvidenceInBox(image,cx,cy,radiusX,radiusY).strong;
        }

        function projectPoint(H, x, y) {
            const h = H.data64F || H.data32F;
            const X = h[0]*x + h[1]*y + h[2];
            const Y = h[3]*x + h[4]*y + h[5];
            const W = h[6]*x + h[7]*y + h[8];
            if (!isFinite(W) || Math.abs(W) < 1e-9) return null;
            return {x:X/W, y:Y/W};
        }

        function redDotDetailScan(refRGBA, targetRGBA, H) {
            const expectedDots=getRedComponentsFromCanvasSource(refRGBA,1);
            const targetImage=makeRGBAData(targetRGBA);
            let found=0,missing=0;
            const resultDisplay=targetRGBA.clone();
            const overlay=document.createElement('canvas');
            overlay.width=targetRGBA.cols; overlay.height=targetRGBA.rows;
            const octx=overlay.getContext('2d');
            cv.imshow(overlay,resultDisplay);

            for(const d of expectedDots){
                const p=projectPoint(H,d.cx,d.cy);
                if(!p || p.x<0 || p.y<0 || p.x>=targetRGBA.cols || p.y>=targetRGBA.rows){
                    missing++; continue;
                }
                const scaleX=targetRGBA.cols/refRGBA.cols;
                const scaleY=targetRGBA.rows/refRGBA.rows;
                const scale=Math.max(0.35,Math.min(4,Math.max(scaleX,scaleY)));
                const rx=Math.max(7,d.w*3.5*scale);
                const ry=Math.max(7,d.h*3.5*scale);
                const ev=getRedEvidenceInBox(targetImage,p.x,p.y,rx,ry);
                const ok=ev.strong>=1 && (ev.score >= (activeSourceType==='camera'?9:7) || ev.maxRedExcess>=12);
                const bw=Math.max(14,d.w*5*scale), bh=Math.max(14,d.h*5*scale);
                octx.strokeStyle=ok?'#22c55e':'#ef4444';
                octx.lineWidth=2;
                octx.strokeRect(p.x-bw/2,p.y-bh/2,bw,bh);
                if(ok) found++; else missing++;
            }
            const annotated=cv.imread(overlay);
            resultDisplay.delete();
            const score=expectedDots.length?(found/expectedDots.length)*100:0;
            return {score,expected:expectedDots.length,found,missing,resultDisplay:annotated};
        }

        btnScan.onclick = async () => {
            if (!isCvReady) { alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่"); return; }
            if (!templateMat) { alert("กรุณาเลือก 'ภาพสัญลักษณ์ต้นฉบับ' ก่อนทำการสแกน"); return; }
            if (!activeSourceType) { alert("กรุณาเปิดกล้องหรือเลือกไฟล์ภาพเปรียบเทียบก่อนทำการสแกน"); return; }

            if (isCameraActive) {
                await new Promise(resolve => setTimeout(resolve, 350));
                if (!videoElement.videoWidth || !videoElement.videoHeight) {
                    alert("กล้องยังไม่พร้อม กรุณารอสักครู่แล้วลองใหม่");
                    return;
                }
            }

            let originalText = btnScan.innerText;
            btnScan.innerText = "กำลังตรวจ Micro Detail สีแดงเข้ม...";
            btnScan.disabled = true;

            setTimeout(() => {
                try {
                    let targetSourceElement = isCameraActive ? videoElement : outputCanvas;
                    let targetMat = matFromElement(targetSourceElement, 4000);
                    let grayTempl = new cv.Mat(), grayTarget = new cv.Mat();
                    matToGray(templateMat, grayTempl); matToGray(targetMat, grayTarget);

                    // ORB is ONLY for alignment. It is never part of the Micro Detail score.
                    let orb = new cv.ORB(15000);
                    let kp1 = new cv.KeyPointVector(), kp2 = new cv.KeyPointVector();
                    let des1 = new cv.Mat(), des2 = new cv.Mat();
                    orb.detectAndCompute(grayTempl, new cv.Mat(), kp1, des1);
                    orb.detectAndCompute(grayTarget, new cv.Mat(), kp2, des2);

                    let H = null, inlierCount = 0, goodMatches = [];
                    let resultDisplay = targetMat.clone();
                    let canAlign = false;

                    if (!des1.empty() && !des2.empty() && kp1.size() > 10) {
                        let bf = new cv.BFMatcher(cv.NORM_HAMMING, true);
                        let matches = new cv.DMatchVector();
                        bf.match(des1, des2, matches);
                        for (let i=0; i<matches.size(); i++) {
                            if (matches.get(i).distance < 55) goodMatches.push(matches.get(i));
                        }

                        if (goodMatches.length >= 12) {
                            let srcPoints=[], dstPoints=[];
                            for (let m of goodMatches) {
                                let a=kp1.get(m.queryIdx).pt, b=kp2.get(m.trainIdx).pt;
                                srcPoints.push(a.x,a.y); dstPoints.push(b.x,b.y);
                            }
                            let srcMat=cv.matFromArray(goodMatches.length,1,cv.CV_32FC2,srcPoints);
                            let dstMat=cv.matFromArray(goodMatches.length,1,cv.CV_32FC2,dstPoints);
                            let mask=new cv.Mat();
                            H=cv.findHomography(srcMat,dstMat,cv.RANSAC,4.0,mask);
                            if (!H.empty()) {
                                for(let i=0;i<mask.rows;i++) if(mask.data[i]!==0) inlierCount++;
                                canAlign = inlierCount >= 12;
                            }
                            srcMat.delete(); dstMat.delete(); mask.delete();
                        }
                        matches.delete(); bf.delete();
                    }

                    if (canAlign) {
                        // IMPORTANT: final result is based ONLY on red Micro Detail dots.
                        let micro = redDotDetailScan(templateMat, targetMat, H);
                        resultDisplay.delete();
                        resultDisplay = micro.resultDisplay;

                        // User requirement: PASS only when score is strictly greater than 85%.
                        const isPass = micro.score > 85.0;

                        popupTitle.innerHTML = isPass
                            ? `<span class="text-success">✅ PASS // Micro Detail สีแดงเข้ม</span>`
                            : `<span class="text-danger">❌ FAIL // Micro Detail สีแดงเข้ม</span>`;

                        popupMessage.innerHTML = `
                            Micro Edge Detail: <span style="font-size:1.8rem;font-weight:bold;">${micro.score.toFixed(1)}%</span><br><br>
                            <span style="font-size:.8rem;color:#64748b;">เกณฑ์ PASS: มากกว่า 85.0%</span><br>
                            <span style="font-size:.8rem;color:#64748b;">Micro Detail ทั้งหมด: ${micro.expected.toLocaleString()} จุด</span><br>
                            <span style="font-size:.8rem;color:#059669;">ตรวจพบ: ${micro.found.toLocaleString()} จุด</span><br>
                            <span style="font-size:.8rem;color:#dc2626;">ตรวจไม่พบ: ${micro.missing.toLocaleString()} จุด</span>
                        `;
                    } else {
                        popupTitle.innerHTML=`<span class="text-danger">❌ FAIL // จัดแนวภาพไม่ได้</span>`;
                        popupMessage.innerHTML=`ไม่สามารถจัดแนวภาพเพื่อค้นหาจุดสีแดงได้<br><span style="font-size:.8rem;color:#64748b;">การจัดแนวเป็นเพียงขั้นตอนเตรียมตำแหน่ง และไม่ถูกนำมาคิดคะแนน Micro Detail</span>`;
                    }

                    cv.imshow('outputCanvas', resultDisplay);
                    videoElement.style.display='none'; outputCanvas.style.display='block';
                    popupOverlay.style.display='block'; popupBox.style.display='block';

                    if(H) H.delete();
                    targetMat.delete(); grayTempl.delete(); grayTarget.delete(); resultDisplay.delete();
                    kp1.delete(); kp2.delete(); des1.delete(); des2.delete(); orb.delete();
                } catch(err) {
                    console.error(err);
                    alert("เกิดข้อผิดพลาดในระบบ Micro Detail สีแดงเข้ม: " + err.message);
                }
                btnScan.innerText=originalText; btnScan.disabled=false;
            },100);
        };
    </script>
</body>
</html>
