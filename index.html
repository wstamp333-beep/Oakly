<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBUST QC VISION - CLAHE Multi-Scale</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@600;700&display=swap');
        
        :root { 
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --success: #059669; 
            --danger: #dc2626; 
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text);
            padding: 16px; 
            margin: 0; 
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 16px;
            color: #0369a1;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        
        .panel-title { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-family: 'Oxanium', sans-serif; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .display-box { 
            border: 2px dashed #cbd5e1; 
            border-radius: 12px; 
            aspect-ratio: 4/3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            background-color: #f1f5f9;
        }
        
        .display-box img, .display-box video, .display-box canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            position: absolute;
        }
        
        .file-input-wrapper {
            margin-top: 8px;
            width: 100%;
            font-size: 0.85rem;
            color: var(--text);
            padding: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-secondary {
            background: #475569;
            box-shadow: 0 2px 4px rgba(71, 85, 105, 0.2);
        }
        .btn-secondary:hover { background: #334155; }
        .btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .status-bar {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .popup-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 350px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .popup-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: 'Oxanium', sans-serif;
        }
        .popup-message {
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .popup-close-btn {
            background: #e2e8f0;
            color: var(--text);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .popup-close-btn:hover { background: #cbd5e1; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
    </style>
    
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>

    <h1>ROBUST QC VISION</h1>

    <div class="panel">
        <div class="panel-title">1. ภาพ Micro Detail ต้นฉบับ</div>
        <div class="display-box"><canvas id="refCanvas"></canvas></div>
        <input type="file" id="fileInputRef" class="file-input-wrapper" accept="image/*">
    </div>

    <div class="panel">
        <div class="panel-title">2. ภาพเปรียบเทียบ (กล้องมือถือ / ไฟล์ภาพ)</div>
        <div class="display-box">
            <video id="videoElement" autoplay playsinline muted style="display:none;"></video>
            <img id="targetImage" alt="Target File" style="display:none;">
            <canvas id="outputCanvas"></canvas>
        </div>
        
        <div class="controls-row">
            <button class="btn btn-secondary" id="btnToggleCam">เปิดกล้องมือถือ</button>
            <div id="cameraHint" style="font-size:.75rem;color:#64748b;line-height:1.45;margin-top:8px;text-align:center;">
                ระบบปรับสมดุลแสงและสเกลอัตโนมัติ (CLAHE)
            </div>
        </div>
        
        <div style="margin-top: 12px;">
            <label class="panel-title" style="display:block; margin-bottom:4px;">เลือกไฟล์ภาพเปรียบเทียบจากเครื่อง:</label>
            <input type="file" id="fileInputTarget" class="file-input-wrapper" accept="image/*">
        </div>

        <div style="margin-top: 12px;">
            <button class="btn" id="btnScan">เริ่มสแกนตรวจสอบอัจฉริยะ</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">สถานะ: กำลังโหลด OpenCV Engine...</div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup-box" id="popupBox">
        <div class="popup-title" id="popupTitle">ผลการสแกน</div>
        <div class="popup-message" id="popupMessage"></div>
        <button class="popup-close-btn" onclick="closePopup()">ปิดหน้าต่าง</button>
    </div>

    <script>
        const refCanvas = document.getElementById('refCanvas');
        const videoElement = document.getElementById('videoElement');
        const targetImage = document.getElementById('targetImage');
        const outputCanvas = document.getElementById('outputCanvas');
        const btnScan = document.getElementById('btnScan');
        const btnToggleCam = document.getElementById('btnToggleCam');
        const statusBar = document.getElementById('statusBar');

        const popupOverlay = document.getElementById('popupOverlay');
        const popupBox = document.getElementById('popupBox');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');

        let isCvReady = false;
        let cameraStream = null;
        let isCameraActive = false;
        let activeSourceType = null;
        let templateMat = null;

        let checkInterval = setInterval(() => {
            if (typeof cv !== 'undefined' && typeof cv.Mat === 'function') {
                clearInterval(checkInterval);
                isCvReady = true;
                statusBar.innerText = "สถานะ: พร้อมใช้งาน (CLAHE + Multi-Scale Mode)";
            }
        }, 300);

        document.getElementById('fileInputRef').onchange = (e) => { 
            if(e.target.files[0]) {
                if (!isCvReady) {
                    alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่แล้วลองใหม่อีกครั้ง");
                    return;
                }
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = function() {
                        try {
                            if (templateMat) { templateMat.delete(); templateMat = null; }
                            let canvas = document.createElement('canvas');
                            canvas.width = img.naturalWidth;
                            canvas.height = img.naturalHeight;
                            let ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            
                            templateMat = cv.imread(canvas);
                            if (templateMat.empty()) throw new Error("ไม่สามารถสร้าง Matrix ได้");
                            
                            cv.imshow('refCanvas', templateMat);
                            statusBar.innerText = "สถานะ: โหลดภาพต้นฉบับสำเร็จ พร้อมสแกน";
                        } catch (err) {
                            console.error(err);
                            alert("ไม่สามารถประมวลผลภาพต้นฉบับได้: " + err.message);
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('fileInputTarget').onchange = (e) => {
            if (e.target.files[0]) {
                if (isCameraActive) { stopCamera(); }
                targetImage.src = URL.createObjectURL(e.target.files[0]);
                targetImage.onload = () => {
                    activeSourceType = 'file';
                    let canvasCtx = outputCanvas.getContext('2d');
                    outputCanvas.width = targetImage.naturalWidth;
                    outputCanvas.height = targetImage.naturalHeight;
                    canvasCtx.drawImage(targetImage, 0, 0);
                    outputCanvas.style.display = 'block';
                    targetImage.style.display = 'none';
                    videoElement.style.display = 'none';
                };
            }
        };

        function stopCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); }
            videoElement.srcObject = null;
            isCameraActive = false;
            btnToggleCam.innerText = "เปิดกล้องมือถือ";
            btnToggleCam.style.background = "#475569";
        }

        btnToggleCam.onclick = async () => {
            if (!isCameraActive) {
                try {
                    document.getElementById('fileInputTarget').value = "";
                    const constraints = {
                        video: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280, min: 640 },
                            height: { ideal: 720, min: 480 },
                            frameRate: { ideal: 30, min: 15 }
                        }
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = cameraStream;
                    await videoElement.play();
                    videoElement.style.display = 'block';
                    targetImage.style.display = 'none';
                    outputCanvas.style.display = 'none';
                    
                    isCameraActive = true;
                    activeSourceType = 'camera';
                    btnToggleCam.innerText = "ปิดกล้อง Live";
                    btnToggleCam.style.background = "var(--danger)";
                } catch (err) {
                    alert("ไม่สามารถเปิดกล้องได้: " + err.message);
                }
            } else {
                stopCamera();
                activeSourceType = null;
            }
        };

        function closePopup() {
            popupOverlay.style.display = 'none';
            popupBox.style.display = 'none';
        }

        btnScan.onclick = async () => {
            if (!isCvReady) { alert("ระบบกำลังโหลด OpenCV Engine กรุณารอสักครู่"); return; }
            if (!templateMat || templateMat.empty()) { alert("กรุณาเลือกภาพ Micro Detail ต้นฉบับก่อนทำการสแกน"); return; }
            if (!activeSourceType) { alert("กรุณาเปิดกล้องหรือเลือกไฟล์ภาพเปรียบเทียบก่อนทำการสแกน"); return; }

            if (isCameraActive) {
                await new Promise(resolve => setTimeout(resolve, 350));
                if (!videoElement.videoWidth || !videoElement.videoHeight) {
                    alert("กล้องยังไม่พร้อม กรุณาลองใหม่อีกครั้ง");
                    return;
                }
            }

            let originalText = btnScan.innerText;
            btnScan.innerText = "กำลังปรับสมดุลแสงและสแกน...";
            btnScan.disabled = true;

            setTimeout(() => {
                let targetMat = null, grayTarget = null, grayTempl = null, displayMat = null;
                let claheTarget = null, claheTempl = null, claheObj = null;
                try {
                    let sourceElem = isCameraActive ? videoElement : outputCanvas;
                    let canvas = document.createElement('canvas');
                    canvas.width = sourceElem.naturalWidth || sourceElem.videoWidth || sourceElem.width;
                    canvas.height = sourceElem.naturalHeight || sourceElem.videoHeight || sourceElem.height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(sourceElem, 0, 0);
                    
                    targetMat = cv.imread(canvas);
                    if (targetMat.empty()) throw new Error("ไม่สามารถอ่านภาพเปรียบเทียบได้");

                    grayTarget = new cv.Mat();
                    grayTempl = new cv.Mat();
                    
                    if (targetMat.channels() === 4) cv.cvtColor(targetMat, grayTarget, cv.COLOR_RGBA2GRAY);
                    else cv.cvtColor(targetMat, grayTarget, cv.COLOR_RGB2GRAY);
                    
                    if (templateMat.channels() === 4) cv.cvtColor(templateMat, grayTempl, cv.COLOR_RGBA2GRAY);
                    else cv.cvtColor(templateMat, grayTempl, cv.COLOR_RGB2GRAY);

                    // ใช้ CLAHE (Contrast Limited Adaptive Histogram Equalization) เพื่อแก้ปัญหาแสงสะท้อนและเงาดำ
                    claheObj = cv.createCLAHE(2.0, new cv.Size(8, 8));
                    claheTarget = new cv.Mat();
                    claheTempl = new cv.Mat();
                    claheObj.apply(grayTarget, claheTarget);
                    claheObj.apply(grayTempl, claheTempl);

                    // Multi-Scale Template Matching ค้นหาในหลากหลายระยะ (0.5x ถึง 1.5x)
                    let bestScore = -1;
                    let bestLoc = null;
                    let bestScale = 1.0;
                    let bestW = 0, bestH = 0;

                    let scales = [0.5, 0.7, 0.9, 1.0, 1.1, 1.3, 1.5];
                    for (let scale of scales) {
                        let resizedTempl = new cv.Mat();
                        let dsize = new cv.Size(Math.round(claheTempl.cols * scale), Math.round(claheTempl.rows * scale));
                        
                        if (dsize.width <= 0 || dsize.height <= 0 || dsize.width > claheTarget.cols || dsize.height > claheTarget.rows) {
                            resizedTempl.delete();
                            continue;
                        }

                        cv.resize(claheTempl, resizedTempl, dsize, 0, 0, cv.INTER_AREA);

                        let res = new cv.Mat();
                        cv.matchTemplate(claheTarget, resizedTempl, res, cv.TM_CCOEFF_NORMED);
                        let minMax = cv.minMaxLoc(res);

                        if (minMax.maxVal > bestScore) {
                            bestScore = minMax.maxVal;
                            bestLoc = minMax.maxLoc;
                            bestScale = scale;
                            bestW = resizedTempl.cols;
                            bestH = resizedTempl.rows;
                        }

                        resizedTempl.delete();
                        res.delete();
                    }

                    displayMat = new cv.Mat();
                    if (targetMat.channels() === 4) targetMat.copyTo(displayMat);
                    else cv.cvtColor(targetMat, displayMat, cv.COLOR_RGB2RGBA);

                    let matchPercentage = (bestScore * 100).toFixed(1);
                    const PASS_THRESHOLD = 0.60; // ปรับเกณฑ์ยืดหยุ่นขึ้น (60%) เพื่อรองรับมุมมองและแสงที่ต่างจากเดิม
                    const isPass = bestScore >= PASS_THRESHOLD;

                    if (isPass && bestLoc) {
                        let p1 = new cv.Point(bestLoc.x, bestLoc.y);
                        let p2 = new cv.Point(bestLoc.x + bestW, bestLoc.y + bestH);
                        cv.rectangle(displayMat, p1, p2, new cv.Scalar(0, 255, 0, 255), 4);
                        cv.putText(displayMat, `MATCH ${matchPercentage}%`, new cv.Point(bestLoc.x, Math.max(30, bestLoc.y - 10)), cv.FONT_HERSHEY_SIMPLEX, 0.8, new cv.Scalar(0, 255, 0, 255), 2);
                    }

                    cv.imshow('outputCanvas', displayMat);

                    popupTitle.innerHTML = isPass
                        ? `<span class="text-success">✅ PASS // ตรวจพบ Micro Detail ถูกต้อง</span>`
                        : `<span class="text-danger">❌ FAIL // ไม่พบ Micro Detail ที่ตรงกัน</span>`;

                    popupMessage.innerHTML = `
                        Match Score: <span style="font-size: 1.2em; font-weight: bold; color: #1e293b;">${matchPercentage}%</span><br><br>
                        เกณฑ์ PASS: ความเหมือน &ge; 60%<br>
                        (ระบบเปิดใช้งาน CLAHE ลดผลกระทบเรื่องแสงและระยะ)
                    `;

                    if (isCameraActive) { videoElement.style.display = 'none'; }
                    outputCanvas.style.display = 'block';
                    popupOverlay.style.display = 'block'; 
                    popupBox.style.display = 'block';

                } catch(err) {
                    console.error(err);
                    alert("เกิดข้อผิดพลาดในการตรวจสอบ: " + err.message);
                } finally {
                    if (targetMat) targetMat.delete();
                    if (grayTarget) grayTarget.delete();
                    if (grayTempl) grayTempl.delete();
                    if (claheTarget) claheTarget.delete();
                    if (claheTempl) claheTempl.delete();
                    if (claheObj) claheObj.delete();
                    if (displayMat) displayMat.delete();
                }

                btnScan.innerText = originalText; 
                btnScan.disabled = false;
            }, 100);
        };
    </script>
</body>
</html>
